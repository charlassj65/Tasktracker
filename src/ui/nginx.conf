server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA — all unknown paths fall back to index.html
    # so that React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; Vite hashes filenames on each build.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html so the browser always fetches
    # the latest asset fingerprints after a re-deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
